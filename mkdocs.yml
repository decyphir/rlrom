site_name: RLRom
site_description: Test and train reinforcement learning agents with online monitoring of Signal Temporal Logic specifications
site_author: Alexandre Donzé
site_url: https://rlrom-adf24a.gricad-pages.univ-grenoble-alpes.fr/
repo_url: https://gricad-gitlab.univ-grenoble-alpes.fr/donzeal/rlrom
repo_name: donzeal/rlrom
edit_uri: edit/main/docs/
copyright: BSD 3-Clause, © Université Grenoble Alpes

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: null
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - Guide:
      - STL specifications: guide/specifications.md
      - Reward shaping and observations: guide/reward-shaping.md
      - Reward machines: guide/reward-machines.md
      - Shielding: guide/shielding.md
      - Configuration reference: guide/configuration.md
      - Command line: guide/cli.md
      - Plotting and results: guide/plotting.md
      - Troubleshooting: guide/troubleshooting.md
  - Examples:
      - Overview: examples/index.md
      - CartPole: examples/cartpole.md
      - Highway-env: examples/highway-env.md
      - MiniGrid: examples/minigrid.md
      - MuJoCo: examples/mujoco.md
      - MetaDrive: examples/metadrive.md
      - Acrobot and MountainCar: examples/classic-control.md
  - API:
      - api/index.md
      - Wrappers: api/wrappers.md
      - Training and testing: api/trainers-testers.md
      - Configuration and utilities: api/config-utils.md
  - About:
      - Citation: about/citation.md
      - License: about/license.md
      - Changelog: about/changelog.md
