# Reversed task: the environment's own reward with the forward term
# negated, so it pays for travelling in -x.
#
#   reward = -1.0 * v_x + 1.0 * alive - 1e-3 * sum(a^2)

env_name: Hopper-v4
env_kwargs:
  forward_reward_weight: -1.0
model_path: ./models
model_name: td3_hopper_backward

cfg_test:
  init_seeds: 0
  num_ep: 10
  num_steps: 1000
  render_mode: 'None'

cfg_train:
  torch_num_threads: 4
  n_envs: 8
  eval_freq: 20_000
  total_timesteps: 300_000
  progress_bar: True

  algo:
    td3: td3_hopper.yml

  eval:
    init_seeds: 0
    num_ep: 10
    num_steps: 1000
    render_mode: None
