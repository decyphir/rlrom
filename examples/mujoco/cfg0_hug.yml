# Direct interface to a policy published on the Hugging Face Hub.
#
# Two ids, because they answer different questions:
#   env_name  what the policy was published under -- also the checkpoint name,
#             so it keeps the Gym-era -v3 suffix and finds td3-Hopper-v3.zip
#   env_id    what gymnasium builds; the -v4 port has the same spaces, so the
#             -v3 policy transfers unchanged
#
# The TD3 checkpoint ships without observation normalisation, so it can be run
# as-is; the PPO policies in the same org need a VecNormalize wrapper and will
# score near zero without one.

env_name: Hopper-v3
env_id: Hopper-v4
model_path: huggingface
model_name: sb3/td3-Hopper-v3

cfg_test:
  init_seeds: 0
  num_ep: 5
  num_steps: 1000
  render_mode: 'human'
