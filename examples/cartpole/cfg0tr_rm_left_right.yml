env_name: CartPole-v1
model_path: ./models
model_name: rm_left_right
model_use_specs: True

cfg_specs:
  debug_formulas: False
  debug_signals: False
  action_names:
    push: "action"
  obs_names:
    x:     "obs[0]"
    x_dot: "obs[1]"
    theta: "obs[2]"
    theta_dot: "obs[3]"
  specs: cartpole.stl

  # Reward machines driven by the labels above.
  env_reward_weight: 0.5
  
  label_formulas:
    go_left:
      online: True
      past_horizon: 0  
    cart_in_A:
      online: True
      past_horizon: 0
    go_right:
      online: True
      past_horizon: 0

  reward_machines:
    - name: left_right
      weight: 0.5
      reward_machine:
        in_observation: True
        states:
          - id: u0
            initial: True
            reward: 0
          - id: u1
            reward: 0
        transitions:
          - from: u0
            to: u0
            condition: go_left
            reward: 1
          - from: u0
            to: u1
            condition: cart_in_A
            priority: 1
          - from: u1
            to: u1
            condition: go_right
            reward: 1


  eval_formulas:
    go_left:
      online: True
      past_horizon: 0
    go_right:
      online: True
      past_horizon: 0
    cart_on_left:
      online: True
      past_horizon: 0
    cart_on_right:
      online: True
      past_horizon: 0
    phi_right_goal:
      t0: 0
      eval_all_steps: false
  

cfg_test:
  init_seeds: 0
  num_ep: 1
  num_steps: 500
  render_mode: human

cfg_train:
  n_envs: 4
  eval_freq: 10000
  total_timesteps: 200_000

  algo:
    ppo: cartpole_ppo.yml

  eval:
    init_seeds: 0
    num_ep: 10
    num_steps: 500
    render_mode: None
