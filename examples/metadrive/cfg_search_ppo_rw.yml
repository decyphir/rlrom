# Baseline search on the reward-tweaked env (cfg_env_reward.yml). model_name is
# overridden per run (--set-params model_name=ppo_rw_rN).
env_name: metadrive
model_path: ./models
model_name: ppo_rw
import_module: metadrive_env
make_env_train: make_env_train
make_env_test: make_env_test
cfg_env: cfg_env_reward.yml
cfg_specs:
  episode_info_keys: [arrive_dest, route_completion, crash, out_of_road]
cfg_train:
  n_envs: 6
  total_timesteps: 1_200_000
  torch_num_threads: 2
  eval_freq: 60_000
  algo:
    ppo: metadrive_ppo.yml
  eval:
    init_seeds: 0
    num_ep: 5
    num_steps: 1000
    render_mode: None
cfg_test:
  init_seeds: 0
  num_ep: 100
  num_steps: 1000
  render_mode: None
