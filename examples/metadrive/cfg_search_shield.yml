# Shielded retraining (Phase 4): same faithful env and PPO as the baseline search,
# but the SpecWrapper shield is active during training (cfg_specs.yml). model_name
# overridden per run (--set-params model_name=ppo_shielded_rN).
env_name: metadrive
model_path: ./models
model_name: ppo_shielded
import_module: metadrive_env
make_env_train: make_env_train
make_env_test: make_env_test
cfg_env: cfg_env.yml
cfg_specs: cfg_specs.yml
cfg_train:
  n_envs: 6
  total_timesteps: 1_200_000
  torch_num_threads: 2
  eval_freq: 60_000
  algo:
    ppo: metadrive_ppo.yml
  eval:
    init_seeds: 0
    num_ep: 5
    num_steps: 1000
    render_mode: None
cfg_test:
  init_seeds: 0
  num_ep: 100
  num_steps: 1000
  render_mode: None
