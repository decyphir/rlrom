# PPO with gSDE: state-dependent exploration, often yields a better deterministic
# mean than i.i.d. Gaussian action noise.
device: cpu
verbose: 0
policy_kwargs:
  net_arch: [256, 256]
use_sde: True
sde_sample_freq: 4
n_steps: 2048
batch_size: 256
learning_rate: 3e-4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
