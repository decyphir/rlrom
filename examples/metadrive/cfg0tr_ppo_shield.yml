# Shielded MetaDrive configuration (STL monitoring + continuous-action shield).
#   passive test on the vanilla policy:
#     uv run rlr test examples/metadrive/cfg0tr_ppo_shield.yml \
#       --cfg-test cfg_smoke_ppo_test.yml --set-params model_name=ppo_vanilla
#   shielded retrain (Phase 4): uv run rlr train examples/metadrive/cfg0tr_ppo_shield.yml
# The shield is active whenever `shield_activate` held at the previous step
# (past-anchored, see cfg_specs.yml / metadrive.stl).

env_name: metadrive
model_path: ./models
model_name: ppo_shielded

import_module: metadrive_env
make_env_train: make_env_train
make_env_test: make_env_test

cfg_env: cfg_env.yml
cfg_specs: cfg_specs.yml

cfg_train:
  n_envs: 8
  total_timesteps: 5_000_000
  torch_num_threads: 2
  eval_freq: 250_000
  algo:
    ppo: metadrive_ppo.yml
  eval:
    init_seeds: 0
    num_ep: 10
    num_steps: 1000
    render_mode: None

cfg_test:
  init_seeds: 0
  num_ep: 100
  num_steps: 1000
  render_mode: None
