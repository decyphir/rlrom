env_name: highway-v0
import_module: highway
make_env_train: make_env_train
make_env_test: make_env_test
model_name: rm_right_lane
model_path: ./models
model_use_specs: True

cfg_env: cfg_env.yml
cfg_specs: cfg_specs_rm.yml

cfg_train:
  total_timesteps: 250_000      
  eval_freq: 10_000
  n_envs: 8
  algo:
    ppo: highway_env_ppo.yml
  eval:
    init_seeds: 0
    num_ep: 10
    num_steps: 100
    render_mode: 'None'
    
cfg_test:
  init_seeds: 0
  num_ep: 1
  num_steps: 200
  render_mode: 'human'
  plot:
    - ax:
      - monitor_formulas/car_left
      - monitor_formulas/car_right
      - monitor_formulas/danger
      - action
      - ego_vx
      live: False 
#      live_window: 50

    - ax:
      - sat(mu_danger)
      - sat(danger)
