env_name: highway-v0
import_module: highway
make_env_train: make_env_train
make_env_test: make_env_test
model_name: basic
model_path: ./models
model_use_specs: True

cfg_env: cfg_env.yml
cfg_specs: cfg_specs_multi_objective.yml

cfg_train:
  total_timesteps: 200_000      
  freq_eval: 10_000
  n_envs: 12
  algo:
    pcn:
      scaling_factor:
        - 1.0
        - 1.0
        - 0.1
        - 0.1


cfg_test:
  init_seeds: 0
  num_ep: 2
  num_steps: 100
  render_mode: 'human'
