env_name: "highway-v0"

action_names:
  action: "action"
obs_names:
  ego_presence: "obs[0][0]"
  ego_x: "obs[0][1]"
  ego_y: "obs[0][2]"
  ego_vx: "80*obs[0][3]"
  ego_vy: "80*obs[0][4]"
  car1_presence: "obs[1][0]"
  car1_x: "obs[1][1]"
  car1_y: "obs[1][2]"
  car1_vx: "80*obs[1][3]"
  car1_vy: "80*obs[1][4]"
  car2_presence: "obs[2][0]"
  car2_x: "obs[2][1]"
  car2_y: "obs[2][2]"
  car2_vx: "80*obs[2][3]"
  car2_vy: "80*obs[2][4]"
  car3_presence: "obs[3][0]"
  car3_x: "obs[3][1]"
  car3_y: "obs[3][2]"
  car3_vx: "80*obs[3][3]"
  car3_vy: "80*obs[3][4]"
  
specs: hw-env_specs.stl

multi_objective: False

monitor_formulas:
  
  # rewarding 
  ego_right_lane:
    semantics: bool
    past_horizon: 0
    reward_weight: .25

  ego_fast:
    semantics: bool
    past_horizon: 0
    reward_weight: .5

  ego_moves:
    past_horizon: 0
    reward_weight: .25
    semantics: bool

  # Monitoring and shielding
  # ACTIONS_ALL = { 0: 'LANE_LEFT', 1: 'IDLE',2: 'LANE_RIGHT', 3: 'FASTER', 4: 'SLOWER'}

  danger:
    past_horizon: 2
    semantics: bool
    obs_weight: 1.0 
    actions:
      priority: 1
      enable: True
      blocked: [1, 3]
      fallback: 4

  danger_and_right_lane:
    past_horizon: 2
    semantics: bool
    actions:
      priority: 1
      enable: True
      blocked: [2]
      fallback: 4

  danger_and_left_lane:
    past_horizon: 2
    semantics: bool
    actions:      
      priority: 1
      enable: True
      blocked: [0]
      fallback: 4

  car_left:
    semantics: bool
    actions:
      enable: True
      blocked: [0]
      fallback: 1
  car_right:
    past_horizon: 0
    semantics: bool
    actions:
      enable: True
      blocked: [2]
      fallback: 1


eval_formulas: 
  ego_fast:
    eval_all_steps: true
  phi_speed:
  
  phi_right_lane:
  ego_right_lane:
    eval_all_steps: true
  
debug_actions: False
disable_actions: False
