env_name: highway-v0
import_module: highway
make_env_train: make_env_train
make_env_test: make_env_test
model_name: right_lane
model_path: ./models
model_use_specs: True

cfg_env: cfg_env.yml
cfg_specs: cfg_specs.yml

cfg_train: 
  total_timesteps: 500_000
  repeat_training: 1
  eval_freq: 10_000
  n_envs: 8  
  eval:
    init_seeds: 0
    num_ep: 10
    num_steps: 100
    render_mode: None 
  
  algo:    
    ppo: highway_env_ppo.yml 
  
cfg_test: 
  init_seeds: 45
  num_ep: 5
  num_steps: 200 
  render_mode: 'human'
