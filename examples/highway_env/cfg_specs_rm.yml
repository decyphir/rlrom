env_name: "highway-v0"
specs: hw-env_specs.stl

action_names:
  action: "action"
obs_names:
  ego_presence: "obs[0][0]"
  ego_x: "obs[0][1]"
  ego_y: "obs[0][2]"
  ego_vx: "80*obs[0][3]"
  ego_vy: "80*obs[0][4]"
  car1_presence: "obs[1][0]"
  car1_x: "obs[1][1]"
  car1_y: "obs[1][2]"
  car1_vx: "80*obs[1][3]"
  car1_vy: "80*obs[1][4]"
  car2_presence: "obs[2][0]"
  car2_x: "obs[2][1]"
  car2_y: "obs[2][2]"
  car2_vx: "80*obs[2][3]"
  car2_vy: "80*obs[2][4]"
  car3_presence: "obs[3][0]"
  car3_x: "obs[3][1]"
  car3_y: "obs[3][2]"
  car3_vx: "80*obs[3][3]"
  car3_vy: "80*obs[3][4]"


reward_formulas:
  ego_right_lane: # faut rester à droite
    past_horizon: 0
    weight: .1
    semantics: bool
  
  ego_moves: # faut pas traîner derrière
    past_horizon: 0
    weight: .1
    semantics: bool

  ego_fast: # faut aller vite
    past_horizon: 0
    weight: .8
    semantics: bool

label_formulas:
  car_left: 
  no_car_left: 
  car_right: 
  no_car_right: 
  danger: 
  no_danger: 

# ACTIONS_ALL = { 0: 'LANE_LEFT', 1: 'IDLE',2: 'LANE_RIGHT', 3: 'FASTER', 4: 'SLOWER'}
reward_machines:
  - name: check_left
    in_observation: True
    shield_active: True
    fsm:
      states:
        - id: u_free
          initial: True
        - id: u_occupied
          blocked: [0]
          fallback: 4
      transitions:
        - from: u_free
          to: u_occupied
          condition: car_left
        - from: u_occupied
          to: u_free
          condition: no_car_left
  - name: check_right
    in_observation: True
    shield_active: True
    fsm:
      states:
        - id: u_free
          initial: True
        - id: u_occupied
          blocked: [2]
          fallback: 4
      transitions:
        - from: u_free
          to: u_occupied
          condition: car_right
        - from: u_occupied
          to: u_free
          condition: no_car_right
  - name: check_danger
    in_observation: True
    shield_active: True
    shield_priority: 2
    fsm:
      states:
        - id: u_free
          initial: True
        - id: u_occupied
          blocked: [1,3]
          fallback: 4
      transitions:
        - from: u_free
          to: u_occupied
          condition: danger
        - from: u_occupied
          to: u_free
          condition: no_danger


debug_formulas: False
debug_rm: False  
eval_formulas: cfg_eval.yml
