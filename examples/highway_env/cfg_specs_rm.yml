env_name: "highway-v0"
specs: hw-env_specs.stl

action_names:
  action: "action"
obs_names:
  ego_presence: "obs[0][0]"
  ego_x: "obs[0][1]"
  ego_y: "obs[0][2]"
  ego_vx: "80*obs[0][3]"
  ego_vy: "80*obs[0][4]"
  car1_presence: "obs[1][0]"
  car1_x: "obs[1][1]"
  car1_y: "obs[1][2]"
  car1_vx: "80*obs[1][3]"
  car1_vy: "80*obs[1][4]"
  car2_presence: "obs[2][0]"
  car2_x: "obs[2][1]"
  car2_y: "obs[2][2]"
  car2_vx: "80*obs[2][3]"
  car2_vy: "80*obs[2][4]"
  car3_presence: "obs[3][0]"
  car3_x: "obs[3][1]"
  car3_y: "obs[3][2]"
  car3_vx: "80*obs[3][3]"
  car3_vy: "80*obs[3][4]"


monitor_formulas:
  # reward shaping (non-zero reward_weight)
  ego_right_lane: 
    reward_weight: .2
    semantics: bool

  ego_moves: # faut pas traîner derrière
    reward_weight: .1
    semantics: bool

  ego_fast: # faut aller vite
    past_horizon: 0
    reward_weight: .7
    semantics: bool

  # formulas with actions (shields)
  car_left:
    actions: 
      enable: True
      blocked: [0]
      fallback: 1

  car_right:
    actions:
      enable: True
      blocked: [2]
      fallback: 1
      
  danger:
    obs_weight: 1 # in observation
    past_horizon: 5
    semantics: bool
    actions:
      enable: True
      blocked: [1,3]
      fallback: 4
# ACTIONS_ALL = { 0: 'LANE_LEFT', 1: 'IDLE',2: 'LANE_RIGHT', 3: 'FASTER', 4: 'SLOWER'}

eval_formulas: cfg_eval.yml

debug_actions: True