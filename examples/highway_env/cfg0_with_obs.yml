env_name: highway-v0
import_module: highway
make_env_train: make_env_train
make_env_test: make_env_test
model_path: ./models
model_name: basic_with_obs
model_use_specs: True

#cfg_env: cfg_env_manual.yml 
cfg_env: cfg_env.yml
cfg_specs: cfg_specs_with_obs.yml
cfg_train: 
  total_timesteps: 200_000
  eval_freq: 10000
  n_envs: 8
  
  eval:
    init_seeds: 0
    num_ep: 10
    num_steps: 100
    render_mode: None
 
  algo:
    ppo: highway_env_ppo.yml  

cfg_test: 
  init_seeds: 0
  num_ep: 10
  num_steps: 200 
  render_mode: 'human'
  plot:
   - ax: 
      - obs_formulas/danger
      - reward, reward_formulas/ego_moves:weighted,reward_formulas/ego_fast:weighted 
     live: False
     live_window: 100
  