[project]
name = "rlrom"
dynamic = ["version"]
description = "Test and train reinforcement learning agents with online monitoring of Signal Temporal Logic specifications."
authors = [{ name = "Alexandre Donze", email = "alexandre.donze@univ-grenoble-alpes.fr" }]
requires-python = ">=3.12"
readme = "README.md"
license = "BSD-3-Clause"
keywords = [
    "reinforcement-learning",
    "signal-temporal-logic",
    "runtime-verification",
    "runtime-monitoring",
    "reward-shaping",
    "shielding",
    "reward-machines",
    "gymnasium",
    "stable-baselines3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "stlrom (>=0.4.0)",
    "gymnasium[classic_control] (>=1.2.0,<2.0.0)",
    "sb3-contrib>=2.7.0,<3.0.0",
    "huggingface-hub (>=0.34.4,<0.35.0)",
    "huggingface-sb3 (>=3.0,<4.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "stable-baselines3 (>=2.7.0,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "rich (>=14.1.0,<15.0.0)",
    "shimmy (>=2.0.0,<3.0.0)",
    "minigrid (>=3.0.0,<4.0.0)",
    "ruamel-yaml>=0.18.15",
    "polars>=1.34.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "mo-gymnasium>=1.3.2",
]

[project.optional-dependencies]
# Notebook stack: only needed to run the example .ipynb files.
notebooks = [
    "jupyter>=1.1.1,<2",
    "ipympl>=0.10.0",
    "plotly>=6.3.1",
    "kaleido>=1.1.0",
]
old_gym = ["gym (>=0.26.2,<0.27.0)"]
highway-env = ["highway-env (>=1.10.1,<2.0.0)"]
# JAX-based algos (sbx "stable baselines jax") + the TensorFlow stack. sbx pulls
# tensorflow via tfp-nightly; tensorflow/tf-keras also allow loading TF models.
jax = [
    "jax>=0.6.2 ; sys_platform == 'darwin'",
    "jax[cuda12]>=0.6.2 ; sys_platform != 'darwin'",
    "sbx-rl>=0.26.0",
    "tensorflow>=2.20.0",
    "tf-keras>=2.21.0",
]
# Multi-objective RL baselines. Pulls cvxpy/pymoo and the from-source pycddlib C build.
morl = [
    "morl-baselines",
    "pycddlib==2.1.6",
    "jax>=0.6.2 ; sys_platform == 'darwin'",
    "jax[cuda12]>=0.6.2 ; sys_platform != 'darwin'",
]
mujoco = [
    "gym>=0.26.2,<0.27.0",
    "gymnasium[mujoco]>=1.2.0,<2.0.0",
]
# MetaDrive driving simulator. From git, not PyPI: the 0.4.3 release pins
# panda3d==1.10.13 and requires-python <3.12, while the same version on main
# asks for panda3d>=1.10.14 (cp313 wheels exist) and has no upper bound.
# Assets (~170 MB) are pulled separately on first use, see examples/metadrive/.
metadrive = [
    "metadrive-simulator>=0.4.3",
]

[project.urls]
Homepage = "https://gricad-gitlab.univ-grenoble-alpes.fr/donzeal/rlrom"
Repository = "https://gricad-gitlab.univ-grenoble-alpes.fr/donzeal/rlrom"
Issues = "https://gricad-gitlab.univ-grenoble-alpes.fr/donzeal/rlrom/-/issues"
Changelog = "https://gricad-gitlab.univ-grenoble-alpes.fr/donzeal/rlrom/-/blob/main/CHANGELOG.md"
Documentation = "https://rlrom-adf24a.gricad-pages.univ-grenoble-alpes.fr/"

[project.scripts]
rlr = "rlrom.rlrom_run:main"
rlrom_test = "rlrom.rlrom_test:main"
rlrom_train = "rlrom.rlrom_train:main"
rlrom_plot = "rlrom.rlrom_plot:main"
rlrom_select_model = "rlrom.rlrom_select_model:main"

[dependency-groups]
dev = [
    "jupyter>=1.1.1,<2",
]

[tool.hatch.build.targets.sdist]
include = ["src/rlrom", "CHANGELOG.md", "CITATION.cff"]

[tool.hatch.build.targets.wheel]
include = ["src/rlrom"]

[tool.hatch.build.targets.wheel.sources]
"src/rlrom" = "rlrom"

[build-system]
requires = ["hatchling","uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv.sources]
morl-baselines = { git = "https://github.com/LucasAlegre/morl-baselines.git" }
# The PyPI release pins panda3d==1.10.13 and requires-python <3.12; main is the
# same version with panda3d>=1.10.14 and no upper bound (cp313 wheels exist).
metadrive-simulator = { git = "https://github.com/metadriverse/metadrive", rev = "fe54b03327b14bcfc17a9a04b60c8abbee4d7ab1" }
